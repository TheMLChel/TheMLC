<!DOCTYPE html>
<html>
<head>
    <link rel="icon" href="../../img/MASK.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <title>Think Fast!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            overflow-x: hidden;
        }

        .wrapper {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: linear-gradient(to top, #71eaff, #0066ff);
        }

        .press-start-2p-regular {
            font-family: "Press Start 2P", system-ui;
            font-weight: 400;
            font-style: normal;
        }

        .content {
            flex: 1;
            padding: 20px 20px 0 20px;
            text-align: center;
        }

        .container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .container img {
            flex-shrink: 0;
            border: 10px solid #000000;
        }

        .container p {
            font-size: 10px;
            text-align: left;
            margin: 0;
        }

        .bottom-grass {
            display: block;
            width: 100%;
            height: 200px;
            object-fit: fill;
            flex-shrink: 0;
            margin: 0;
            padding: 0;
            vertical-align: bottom;
        }
        
    </style>
</head>
<body>

    <div class="wrapper">

        <div class="content">

            <!-- welcome -->
            <br>
            <p class="press-start-2p-regular" style="font-size: 75px;"><b>Think Fast!</b></p>
            <br>
            <br>
            <br>
            <br>
            <button onclick="window.open('https://themlchel.github.io/TheMLC/index.html', '_self')" style="background: none; border: none; cursor: pointer; padding: 0; font: inherit; text-shadow: 0px 0px 5px rgba(0,0,0,1);">
                <p class="press-start-2p-regular" style="font-size: 20px; margin: 0; color: white;">Вернуться На Главную</p>
            </button>
            <br>
            <br>
            <br>
            <br>
            <br>
            <br>
            <!-- iframe -->
            <iframe
            src="../Zombies-Are-Here_v2.2.html"
            title="Think Fast!"
            loading="loading"
            sandbox="allow-scripts allow-forms"
            allow="fullscreen; geolocation"
            referrerpolicy="no-referrer"
            style="
                display: block;
                width: 100%;
                aspect-ratio: 16 / 9;
                border: 10px solid #000000;
                box-sizing: border-box;
            "
            ></iframe>
            <br>
            <!-- info -->
            <p class="press-start-2p-regular" style="font-size: 25px;"><b><br></b>Нажимайте на цвета, которые написаны на экране. С каждым разом на это будет всё меньше и меньше времени. Думай быстро!</p>
            <br>
            <br>
            <br>
            <br>

            <!-- change list -->
            <p id="qm-something" class="press-start-2p-regular" style="font-size: 50px;">Список Версий:</p>
            <br>
            <br>
            <p class="press-start-2p-regular" style="font-size: 25px;"><b><b>1.1 - Добалено 16 на 9 разрешение. Улучшена графика. Игра добавлена на сайт.</b></p>
            <br>
            <br>
        </div>

        <img src="../../img/grass-land.png" class="bottom-grass">

    </div>

</body>
</html>
