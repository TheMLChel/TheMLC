<body bgcolor="black">
<audio id="bgMusic" autoplay loop muted>
  <source src="deep-ocean.mp3" type="audio/mpeg">
</audio>

<script>
  window.addEventListener('load', function() {
    const audio = document.getElementById('bgMusic');
    
    // Снимаем заглушку через 0.1 секунды
    setTimeout(function() {
      audio.muted = false;
    }, 100);
  });
</script>
