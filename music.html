<!DOCTYPE html>
<html>
<head>
    <link rel="icon" href="MASK.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <title>TheMLC`s Music</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            overflow-x: hidden;
        }

        .wrapper {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: linear-gradient(to top, #71eaff, #0066ff);
        }

        .press-start-2p-regular {
            font-family: "Press Start 2P", system-ui;
            font-weight: 400;
            font-style: normal;
        }

        .content {
            flex: 1;
            padding: 20px 20px 0 20px;
            text-align: center;
        }

        .container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .container img {
            flex-shrink: 0;
            border: 10px solid #000000;
        }

        .container p {
            font-size: 10px;
            text-align: left;
            margin: 0;
        }

        .bottom-grass {
            display: block;
            width: 100%;
            height: 200px;
            object-fit: fill;
            flex-shrink: 0;
            margin: 0;
            padding: 0;
            vertical-align: bottom;
        }
    </style>
</head>

    <div class="wrapper">
